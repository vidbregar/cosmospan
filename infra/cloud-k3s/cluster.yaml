cluster_name: cloud-k3s
kubeconfig_path: "./kubeconfig"
k3s_version: v1.34.8+k3s1
protect_against_deletion: false

networking:
  ssh:
    port: 22
    use_agent: false
    use_private_ip: false
    public_key_path: "~/.ssh/hetzner.pub"
    private_key_path: "~/.ssh/hetzner"
  allowed_networks:
    ssh:
      - 0.0.0.0/0
    api:
      - 0.0.0.0/0
    custom_firewall_rules:
      - description: "Allow HTTP from any IPv4"
        direction: in
        protocol: tcp
        port: 80
        source_ips:
          - 0.0.0.0/0
      - description: "Istio East-West Gateway - Mutual TLS Mesh Traffic"
        direction: in
        protocol: tcp
        port: 15443
        source_ips:
          - 0.0.0.0/0
      - description: "Istio East-West Gateway - Cross-Cluster Discovery (XDS)"
        direction: in
        protocol: tcp
        port: 15012
        source_ips:
          - 0.0.0.0/0
  public_network:
    ipv4: true
    ipv6: false
  private_network:
    enabled: true
    subnet: 10.1.0.0/16

  cni:
    cluster_cidr: 10.244.0.0/16
    service_cidr: 10.43.0.0/16
    cluster_dns: 10.43.0.10

masters_pool:
  instance_type: cpx32
  instance_count: 3
  image: ubuntu-24.04
  locations:
    - nbg1
    - nbg1
    - nbg1

worker_node_pools:
  - name: workers
    instance_type: cpx42
    instance_count: 6
    location: nbg1
    image: ubuntu-24.04

addons:
  metrics_server:
    enabled: true
  servicelb: # no luck using Hetzner LBs + Istio multi-cluster
    enabled: true
