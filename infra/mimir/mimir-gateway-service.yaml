apiVersion: v1
kind: Service
metadata:
  name: mimir-gateway
  namespace: mimir
spec:
  ports:
    - name: http-metrics
      port: 80
      protocol: TCP
      targetPort: http-metrics
    - name: legacy-http-metrics
      port: 8080
      protocol: TCP
      targetPort: http-metrics
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
  type: ClusterIP
